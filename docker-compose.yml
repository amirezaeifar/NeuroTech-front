services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-neurotech_db}
      MARIADB_USER: ${DB_USER:-neurotech_user}
      MARIADB_PASSWORD: ${DB_PASS:-neurotech_pass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  web:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-NeuroTech Backend}
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-neurotech_user}
      DB_PASS: ${DB_PASS:-neurotech_pass}
      DB_NAME: ${DB_NAME:-neurotech_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-neurotech}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neurotech-users}
      OTP_DEVELOPMENT_MODE: ${OTP_DEVELOPMENT_MODE:-true}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-replace-with-valid-encryption-key}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

volumes:
  mariadb_data:
  redis_data:

networks:
  backend:
    driver: bridge
